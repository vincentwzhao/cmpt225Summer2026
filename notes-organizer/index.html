<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMPT 225 Notes Organizer</title>
  <style>
:root {
  --bg: #0f1115;
  --panel: #161923;
  --panel-alt: #1c202c;
  --border: #2a2f3d;
  --text: #e6e8ee;
  --text-dim: #9aa0b0;
  --accent: #7c9fff;
  --accent-dim: #37436b;
  --danger: #e5686f;
  --radius: 8px;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f6f9;
    --panel: #ffffff;
    --panel-alt: #f0f1f6;
    --border: #dde0ea;
    --text: #1c1f2a;
    --text-dim: #656b7a;
    --accent: #3a5ce8;
    --accent-dim: #dbe2ff;
    --danger: #c8323b;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-shrink: 0;
}

header h1 {
  font-size: 16px;
  margin: 0;
}

header .subtitle {
  color: var(--text-dim);
  font-size: 13px;
}

.layout {
  flex: 1;
  display: grid;
  grid-template-columns: 220px 300px 1fr;
  min-height: 0;
}

.panel {
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.panel:last-child {
  border-right: none;
}

.panel-header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-shrink: 0;
}

.panel-header h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-dim);
  margin: 0;
}

#topic-list {
  list-style: none;
  margin: 0;
  padding: 6px;
  overflow-y: auto;
}

.topic-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 10px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  color: var(--text-dim);
}

.topic-item:hover {
  background: var(--panel-alt);
}

.topic-item.active {
  background: var(--accent-dim);
  color: var(--text);
}

.topic-item .count {
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

#search-input {
  width: 100%;
  padding: 8px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--panel-alt);
  color: var(--text);
  font-size: 13px;
}

#note-list {
  list-style: none;
  margin: 0;
  padding: 6px;
  overflow-y: auto;
  flex: 1;
}

.note-item {
  padding: 10px;
  border-radius: var(--radius);
  cursor: pointer;
  margin-bottom: 4px;
}

.note-item:hover {
  background: var(--panel-alt);
}

.note-item.active {
  background: var(--accent-dim);
}

.note-item-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  font-size: 13px;
}

.pin {
  color: #e0b34c;
}

.note-item-meta {
  margin-top: 4px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.badge {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 100px;
  background: var(--accent-dim);
  color: var(--text);
}

.badge.subtle {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
}

.note-item-snippet {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.note-item-date {
  margin-top: 4px;
  font-size: 11px;
  color: var(--text-dim);
}

.note-list-empty {
  padding: 20px 10px;
  color: var(--text-dim);
  font-size: 13px;
  text-align: center;
}

.icon-btn {
  border: 1px solid var(--border);
  background: var(--panel-alt);
  color: var(--text);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-size: 12px;
  cursor: pointer;
}

.icon-btn:hover {
  border-color: var(--accent);
}

.icon-btn.active {
  background: var(--accent-dim);
  border-color: var(--accent);
}

.icon-btn.danger:hover {
  border-color: var(--danger);
  color: var(--danger);
}

#editor {
  display: flex;
  flex-direction: column;
  min-height: 0;
  flex: 1;
  padding: 16px 20px;
  overflow-y: auto;
}

#editor.hidden,
#empty-state.hidden {
  display: none;
}

#empty-state {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  font-size: 14px;
  text-align: center;
  padding: 40px;
}

#editor-title {
  font-size: 20px;
  font-weight: 700;
  border: none;
  background: transparent;
  color: var(--text);
  padding: 4px 0;
  margin-bottom: 10px;
  outline: none;
}

.editor-meta-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.editor-meta-row select,
.editor-meta-row input[type='text'] {
  padding: 7px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--panel-alt);
  color: var(--text);
  font-size: 13px;
}

#editor-tags {
  flex: 1;
  min-width: 160px;
}

.editor-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

#editor-updated {
  font-size: 12px;
  color: var(--text-dim);
}

#editor-content,
#editor-preview {
  flex: 1;
  min-height: 300px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 12px;
  font-size: 14px;
  line-height: 1.55;
}

#editor-content {
  background: var(--panel-alt);
  color: var(--text);
  resize: none;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

#editor-preview {
  background: var(--panel);
  overflow-y: auto;
}

#editor-preview h3,
#editor-preview h4,
#editor-preview h5,
#editor-preview h6 {
  margin: 0.6em 0 0.3em;
}

#editor-preview p {
  margin: 0.4em 0;
}

#editor-preview code {
  background: var(--panel-alt);
  padding: 1px 5px;
  border-radius: 4px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

#editor-preview pre {
  background: var(--panel-alt);
  padding: 10px;
  border-radius: var(--radius);
  overflow-x: auto;
}

.hidden {
  display: none !important;
}

.related-materials {
  margin: 4px 0 14px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel-alt);
}

.related-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.related-empty {
  font-size: 12px;
  color: var(--text-dim);
}

.related-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.related-list li {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
}

.related-list a {
  color: var(--accent);
  text-decoration: none;
}

.related-list a:hover {
  text-decoration: underline;
}

.coverage-panel {
  overflow-y: auto;
  padding: 16px 20px;
}

.coverage-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.coverage-table th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.coverage-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

.coverage-row.topic-row td {
  font-weight: 700;
  background: var(--panel-alt);
}

.coverage-row.sub-row:hover {
  background: var(--panel-alt);
  cursor: pointer;
}

.coverage-row.sub-row td:first-child {
  padding-left: 26px;
  color: var(--text-dim);
}

.coverage-status {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 100px;
}

.coverage-status.has-notes {
  background: #1f6e4a33;
  color: #3fbf80;
}

.coverage-status.has-materials {
  background: var(--accent-dim);
  color: var(--accent);
}

.coverage-status.gap {
  background: #e5686f26;
  color: var(--danger);
}

.coverage-links {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.coverage-links a {
  color: var(--text);
  text-decoration: none;
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 1px 8px;
}

.coverage-links a:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.coverage-links .none {
  color: var(--text-dim);
  font-size: 12px;
}

@media (max-width: 900px) {
  .layout {
    grid-template-columns: 1fr;
    grid-auto-rows: auto;
    overflow-y: auto;
  }
  .panel {
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
}
  </style>
</head>
<body>
  <header>
    <h1>CMPT 225 — Fall 2026</h1>
    <span class="subtitle">Notes Organizer</span>
    <span style="flex:1"></span>
    <button id="coverage-toggle" class="icon-btn" title="See which syllabus topics have notes, lectures, and quizzes">Topic Coverage</button>
  </header>

  <div class="layout">
    <section class="panel">
      <div class="panel-header">
        <h2>Topics</h2>
      </div>
      <ul id="topic-list"></ul>
    </section>

    <div id="notes-view" style="display: contents">
      <section class="panel">
        <div class="panel-header">
          <input id="search-input" type="text" placeholder="Search notes…" />
          <button id="new-note-btn" class="icon-btn" title="New note">+ New</button>
        </div>
        <ul id="note-list"></ul>
        <div class="panel-header">
          <button id="export-btn" class="icon-btn">Export JSON</button>
          <label class="icon-btn" for="import-input" style="cursor:pointer;">Import JSON</label>
          <input id="import-input" type="file" accept="application/json" class="hidden" />
        </div>
      </section>

      <section class="panel">
        <div id="empty-state">
          Select a note from the list, or create a new one to start organizing your CMPT 225 notes
          by topic — OOP in Java, ADTs, data structures, algorithms, and algorithm efficiency.
        </div>
        <div id="editor" class="hidden">
          <input id="editor-title" type="text" placeholder="Note title" />
          <div class="editor-meta-row">
            <select id="editor-topic"></select>
            <select id="editor-subtopic"></select>
            <input id="editor-tags" type="text" placeholder="tags, comma, separated" />
          </div>
          <div id="related-materials" class="related-materials"></div>
          <div class="editor-toolbar">
            <div>
              <button id="pin-toggle" class="icon-btn" title="Pin note">★ Pin</button>
              <button id="preview-toggle" class="icon-btn">Preview</button>
              <button id="delete-note-btn" class="icon-btn danger">Delete</button>
            </div>
            <span id="editor-updated"></span>
          </div>
          <textarea id="editor-content" placeholder="Write your notes here (Markdown-ish: # headers, **bold**, *italic*, `code`, ```code blocks```, - lists, [links](url))."></textarea>
          <div id="editor-preview" class="hidden"></div>
        </div>
      </section>
    </div>

    <section id="coverage-view" class="panel coverage-panel hidden" style="grid-column: 2 / -1;">
      <div id="coverage-table-wrap"></div>
    </section>
  </div>

  <script>
// CMPT 225 (Fall 2026) Notes Organizer
// Everything lives in localStorage, keyed by STORAGE_KEY, so notes persist
// across visits to this page but never leave the browser.

const STORAGE_KEY = 'cmpt225-fall26-notes-v1';

const TOPICS = [
  {
    id: 'oop',
    name: 'Object-Oriented Programming in Java',
    subtopics: [],
  },
  {
    id: 'adt',
    name: 'Abstract Data Types (ADTs)',
    subtopics: [],
  },
  {
    id: 'ds',
    name: 'Data Structures',
    subtopics: [
      'Lists',
      'Stacks',
      'Queues',
      'Sets',
      'Trees',
      'Binary Trees',
      'Binary Search Trees',
      'Self-Balancing Trees',
      'Priority Queues',
      'Heaps',
      'Hash Tables',
      'Disk-Bound Data',
    ],
  },
  {
    id: 'algo',
    name: 'Algorithms',
    subtopics: [
      'Searching',
      'Sorting',
      'Graph Traversing',
      'Recursion',
      'Divide and Conquer',
    ],
  },
  {
    id: 'analysis',
    name: 'Algorithm Efficiency',
    subtopics: ['Time Complexity', 'Space Complexity', 'Big-O Notation', 'Master Theorem'],
  },
  {
    id: 'other',
    name: 'Other',
    subtopics: [],
  },
];

const topicById = (id) => TOPICS.find((t) => t.id === id);

// Maps syllabus topics/subtopics to the actual lecture and quiz files in this
// repo, so a note's editor can surface "here's the material for this" and
// the coverage view can show what has no notes yet. Paths are relative to
// this file's location (notes-organizer/index.html), so they only resolve
// when this file stays inside the cloned repo.
//
// Built from the real lecture slide titles (opened with python-pptx) and
// each quiz's stated textbook chapters (Goodrich/Tamassia/Mount, "Data
// Structures and Algorithms in C++", 2nd ed.) rather than guessed from
// folder names. If a lecture gets reordered or retitled, update this list.
const RESOURCES = [
  { type: 'lecture', label: 'Lecture 2–3: Introduction to Linked Lists', path: '../lectures/lecture2_3/lecture2.pptx', topics: [{ topic: 'ds', subtopics: ['Lists'] }] },
  { type: 'lecture', label: 'Lecture 4: Linked List Practice', path: '../lectures/lecture4/', topics: [{ topic: 'ds', subtopics: ['Lists'] }] },
  { type: 'lecture', label: 'Lecture 5–6: Variations on Linked Lists', path: '../lectures/lecture5_6/lecture6.pptx', topics: [{ topic: 'ds', subtopics: ['Lists'] }] },
  { type: 'lecture', label: 'Lecture 7–9: Big-O Notation', path: '../lectures/lecture7_8_9/O_notation.md', topics: [{ topic: 'analysis', subtopics: ['Big-O Notation', 'Time Complexity'] }] },
  { type: 'lecture', label: 'Lecture 10–11: Arrays, Stacks & Queues', path: '../lectures/lecture10_11/lecture10_11.pptx', topics: [{ topic: 'ds', subtopics: ['Stacks', 'Queues'] }] },
  { type: 'lecture', label: 'Lecture 12–14: Trees', path: '../lectures/lecture12_13_14/lecture_trees.pptx', topics: [{ topic: 'ds', subtopics: ['Trees', 'Binary Trees'] }] },
  { type: 'lecture', label: 'Lecture 15–16: Heaps & Priority Queues', path: '../lectures/lecture15_16/lecture_pqs_and_heaps.pptx', topics: [{ topic: 'ds', subtopics: ['Priority Queues', 'Heaps'] }] },
  { type: 'lecture', label: 'Lecture 17–19: Maps & Hashing', path: '../lectures/lecture17_18_19/MapsAndHashing.pptx', topics: [{ topic: 'ds', subtopics: ['Hash Tables'] }] },
  { type: 'lecture', label: 'Lecture 20–21: Sorting', path: '../lectures/lecture20_21/sorting.pptx', topics: [{ topic: 'algo', subtopics: ['Sorting'] }] },
  { type: 'lecture', label: 'Lecture 22–24: Binary Search Trees', path: '../lectures/lecture22_23_24/binary_search_trees.pptx', topics: [{ topic: 'ds', subtopics: ['Binary Search Trees', 'Self-Balancing Trees'] }] },
  { type: 'lecture', label: 'Lecture 25–29: Graph Algorithms', path: '../lectures/lecture25_26_27_28_29/graphAlgorithms.pptx', topics: [{ topic: 'algo', subtopics: ['Graph Traversing'] }] },
  { type: 'lecture', label: 'Lecture 30–31: Recursion & Memoization (Fibonacci)', path: '../lectures/lecture30_31/fibonacci.pptx', topics: [{ topic: 'algo', subtopics: ['Recursion', 'Divide and Conquer'] }] },
  { type: 'lecture', label: 'Lecture 32–34: Object-Oriented Design', path: '../lectures/lecture32_33_34/oo_design.pptx', topics: [{ topic: 'oop' }] },

  { type: 'quiz', label: 'Quiz 1 problem set (Lists, Sorting, Big-O)', path: '../quiz1_problemset.md', topics: [{ topic: 'ds', subtopics: ['Lists'] }, { topic: 'algo', subtopics: ['Sorting'] }, { topic: 'analysis', subtopics: ['Big-O Notation', 'Time Complexity'] }] },
  { type: 'quiz', label: 'Quiz 1 sample solutions', path: '../quiz1_sol.pdf', topics: [{ topic: 'ds', subtopics: ['Lists'] }, { topic: 'algo', subtopics: ['Sorting'] }, { topic: 'analysis', subtopics: ['Big-O Notation', 'Time Complexity'] }] },
  { type: 'quiz', label: 'Quiz 2 problem set (Stacks, Queues, Trees)', path: '../quiz2_problemset.pdf', topics: [{ topic: 'ds', subtopics: ['Stacks', 'Queues', 'Trees'] }] },
  { type: 'quiz', label: 'Quiz 2 sample solutions', path: '../quiz2_sol.pdf', topics: [{ topic: 'ds', subtopics: ['Stacks', 'Queues', 'Trees'] }] },
  { type: 'quiz', label: 'Quiz 3 problem set (Heaps, PQs, Hash Tables)', path: '../quiz3_problemset.pdf', topics: [{ topic: 'ds', subtopics: ['Priority Queues', 'Heaps', 'Hash Tables'] }] },
  { type: 'quiz', label: 'Quiz 3 sample solutions', path: '../quiz3_sol.pdf', topics: [{ topic: 'ds', subtopics: ['Priority Queues', 'Heaps', 'Hash Tables'] }] },
  { type: 'quiz', label: 'Quiz 4 problem set (Sorting, BSTs, Self-Balancing Trees, Sets)', path: '../quiz4_problemset.pdf', topics: [{ topic: 'algo', subtopics: ['Sorting'] }, { topic: 'ds', subtopics: ['Binary Search Trees', 'Self-Balancing Trees', 'Sets'] }] },
  { type: 'quiz', label: 'Quiz 4 sample solutions', path: '../quiz4_sol.pdf', topics: [{ topic: 'algo', subtopics: ['Sorting'] }, { topic: 'ds', subtopics: ['Binary Search Trees', 'Self-Balancing Trees', 'Sets'] }] },
  { type: 'quiz', label: 'Quiz 5 problem set (Graph Algorithms, Recursion)', path: '../quiz5_problemset.pdf', topics: [{ topic: 'algo', subtopics: ['Graph Traversing', 'Recursion', 'Divide and Conquer'] }] },
  { type: 'quiz', label: 'Quiz 5 sample solutions', path: '../quiz5_sol.pdf', topics: [{ topic: 'algo', subtopics: ['Graph Traversing', 'Recursion', 'Divide and Conquer'] }] },
  { type: 'quiz', label: '(Mostly) OOP problem set', path: '../oop_problemset.pdf', topics: [{ topic: 'oop' }] },
];

function resourceMatchesTopic(resource, topicId, subtopicName) {
  return resource.topics.some((t) => {
    if (t.topic !== topicId) return false;
    if (!subtopicName) return true; // topic-wide lookup: any subtopic tag counts
    if (!t.subtopics || t.subtopics.length === 0) return true; // topic-wide resource
    return t.subtopics.includes(subtopicName);
  });
}

function resourcesFor(topicId, subtopicName) {
  return RESOURCES.filter((r) => resourceMatchesTopic(r, topicId, subtopicName));
}

// ---------- storage ----------

function loadNotes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error('Failed to load notes', e);
    return [];
  }
}

function saveNotes(notes) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
}

let notes = loadNotes();
let activeNoteId = null;
let activeTopicFilter = 'all';
let searchQuery = '';

function uid() {
  return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function upsertNote(note) {
  const idx = notes.findIndex((n) => n.id === note.id);
  if (idx === -1) notes.push(note);
  else notes[idx] = note;
  saveNotes(notes);
}

function deleteNote(id) {
  notes = notes.filter((n) => n.id !== id);
  saveNotes(notes);
  if (activeNoteId === id) activeNoteId = null;
}

// ---------- rendering ----------

const $ = (sel) => document.querySelector(sel);
const topicListEl = $('#topic-list');
const noteListEl = $('#note-list');
const searchInput = $('#search-input');
const emptyStateEl = $('#empty-state');
const editorEl = $('#editor');
const editorTitle = $('#editor-title');
const editorTopic = $('#editor-topic');
const editorSubtopic = $('#editor-subtopic');
const editorTags = $('#editor-tags');
const editorContent = $('#editor-content');
const editorPreview = $('#editor-preview');
const editorUpdated = $('#editor-updated');
const previewToggle = $('#preview-toggle');

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// A small, dependency-free markdown-ish renderer: headers, bold/italic,
// inline code, fenced code blocks, bullet lists, and links.
function renderMarkdown(src) {
  const lines = escapeHtml(src).split('\n');
  let html = '';
  let inList = false;
  let inCode = false;
  for (const line of lines) {
    if (line.trim().startsWith('```')) {
      inCode = !inCode;
      html += inCode ? '<pre><code>' : '</code></pre>';
      continue;
    }
    if (inCode) {
      html += line + '\n';
      continue;
    }
    const listMatch = line.match(/^\s*[-*]\s+(.*)$/);
    if (listMatch) {
      if (!inList) {
        html += '<ul>';
        inList = true;
      }
      html += `<li>${inline(listMatch[1])}</li>`;
      continue;
    } else if (inList) {
      html += '</ul>';
      inList = false;
    }
    const headerMatch = line.match(/^(#{1,4})\s+(.*)$/);
    if (headerMatch) {
      const level = headerMatch[1].length + 2; // h3..h6
      html += `<h${level}>${inline(headerMatch[2])}</h${level}>`;
      continue;
    }
    if (line.trim() === '') {
      html += '';
    } else {
      html += `<p>${inline(line)}</p>`;
    }
  }
  if (inList) html += '</ul>';
  if (inCode) html += '</code></pre>';
  return html;

  function inline(text) {
    return text
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
}

function formatDate(ts) {
  return new Date(ts).toLocaleString(undefined, {
    year: 'numeric',
    month: 'short',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
  });
}

function renderTopics() {
  const counts = { all: notes.length };
  for (const t of TOPICS) counts[t.id] = notes.filter((n) => n.topic === t.id).length;

  const items = [
    `<li class="topic-item ${activeTopicFilter === 'all' ? 'active' : ''}" data-topic="all">
       <span>All Notes</span><span class="count">${counts.all}</span>
     </li>`,
    ...TOPICS.map(
      (t) => `<li class="topic-item ${activeTopicFilter === t.id ? 'active' : ''}" data-topic="${t.id}">
         <span>${t.name}</span><span class="count">${counts[t.id]}</span>
       </li>`
    ),
  ];
  topicListEl.innerHTML = items.join('');
}

function filteredNotes() {
  let list = notes;
  if (activeTopicFilter !== 'all') {
    list = list.filter((n) => n.topic === activeTopicFilter);
  }
  const q = searchQuery.trim().toLowerCase();
  if (q) {
    list = list.filter((n) =>
      [n.title, n.content, n.subtopic, ...(n.tags || [])].join(' ').toLowerCase().includes(q)
    );
  }
  return list.slice().sort((a, b) => {
    if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    return b.updatedAt - a.updatedAt;
  });
}

function snippet(content, len = 110) {
  const text = content.replace(/\n+/g, ' ').trim();
  return text.length > len ? text.slice(0, len) + '…' : text;
}

function renderNoteList() {
  const list = filteredNotes();
  if (list.length === 0) {
    noteListEl.innerHTML = '<li class="note-list-empty">No notes match.</li>';
    return;
  }
  noteListEl.innerHTML = list
    .map((n) => {
      const topic = topicById(n.topic);
      return `<li class="note-item ${n.id === activeNoteId ? 'active' : ''}" data-id="${n.id}">
        <div class="note-item-head">
          ${n.pinned ? '<span class="pin">★</span>' : ''}
          <span class="note-item-title">${escapeHtml(n.title || 'Untitled')}</span>
        </div>
        <div class="note-item-meta">
          <span class="badge">${topic ? escapeHtml(topic.name) : 'Uncategorized'}</span>
          ${n.subtopic ? `<span class="badge subtle">${escapeHtml(n.subtopic)}</span>` : ''}
        </div>
        <div class="note-item-snippet">${escapeHtml(snippet(n.content || ''))}</div>
        <div class="note-item-date">${formatDate(n.updatedAt)}</div>
      </li>`;
    })
    .join('');
}

function populateTopicSelect() {
  editorTopic.innerHTML = TOPICS.map((t) => `<option value="${t.id}">${t.name}</option>`).join('');
}

function populateSubtopicSelect(topicId, selected) {
  const topic = topicById(topicId);
  const subtopics = topic ? topic.subtopics : [];
  editorSubtopic.innerHTML =
    '<option value="">(none)</option>' +
    subtopics.map((s) => `<option value="${s}" ${s === selected ? 'selected' : ''}>${s}</option>`).join('');
  editorSubtopic.disabled = subtopics.length === 0;
}

function getActiveNote() {
  return notes.find((n) => n.id === activeNoteId) || null;
}

function renderEditor() {
  const note = getActiveNote();
  if (!note) {
    editorEl.classList.add('hidden');
    emptyStateEl.classList.remove('hidden');
    return;
  }
  emptyStateEl.classList.add('hidden');
  editorEl.classList.remove('hidden');

  editorTitle.value = note.title || '';
  populateTopicSelect();
  editorTopic.value = note.topic;
  populateSubtopicSelect(note.topic, note.subtopic);
  editorTags.value = (note.tags || []).join(', ');
  editorContent.value = note.content || '';
  editorUpdated.textContent = `Updated ${formatDate(note.updatedAt)}`;
  $('#pin-toggle').classList.toggle('active', !!note.pinned);
  renderRelatedMaterials();
  updatePreview();
}

function updatePreview() {
  if (editorPreview.classList.contains('hidden')) return;
  editorPreview.innerHTML = renderMarkdown(editorContent.value || '*Nothing here yet.*');
}

function renderRelatedMaterials() {
  const container = $('#related-materials');
  const resources = resourcesFor(editorTopic.value, editorSubtopic.value);
  if (resources.length === 0) {
    container.innerHTML = '<div class="related-empty">No matching lecture or quiz material found for this topic yet.</div>';
    return;
  }
  container.innerHTML =
    '<div class="related-label">Related course materials</div><ul class="related-list">' +
    resources
      .map(
        (r) =>
          `<li><span>${r.type === 'lecture' ? '🎓' : '📝'}</span><a href="${r.path}" target="_blank" rel="noopener">${escapeHtml(r.label)}</a></li>`
      )
      .join('') +
    '</ul>';
}

function refreshAll() {
  renderTopics();
  renderNoteList();
  renderEditor();
}

// ---------- topic coverage view ----------

let viewMode = 'notes';

function coverageRows() {
  const rows = [];
  for (const t of TOPICS) {
    if (t.id === 'other') continue;
    rows.push({ kind: 'topic', topicId: t.id, label: t.name });
    if (t.subtopics.length === 0) {
      rows.push({ kind: 'sub', topicId: t.id, subtopic: null, label: t.name, isOnlyRow: true });
    } else {
      rows.push({ kind: 'sub', topicId: t.id, subtopic: null, label: '(general)' });
      for (const s of t.subtopics) {
        rows.push({ kind: 'sub', topicId: t.id, subtopic: s, label: s });
      }
    }
  }
  return rows;
}

function renderLinkList(resources) {
  if (resources.length === 0) return '<span class="none">—</span>';
  return (
    '<div class="coverage-links">' +
    resources
      .map((r) => `<a href="${r.path}" target="_blank" rel="noopener" title="${escapeHtml(r.label)}">${r.type === 'lecture' ? '🎓' : '📝'} ${escapeHtml(r.label.split(':')[0].split('(')[0].trim())}</a>`)
      .join('') +
    '</div>'
  );
}

function renderCoverage() {
  const wrap = $('#coverage-table-wrap');
  const rows = coverageRows()
    .map((row) => {
      if (row.kind === 'topic') {
        return `<tr class="coverage-row topic-row"><td colspan="4">${escapeHtml(row.label)}</td></tr>`;
      }
      const noteCount = notes.filter(
        (n) => n.topic === row.topicId && (row.isOnlyRow || (row.subtopic === null ? !n.subtopic : n.subtopic === row.subtopic))
      ).length;
      const lectures = resourcesFor(row.topicId, row.subtopic).filter((r) => r.type === 'lecture');
      const quizzes = resourcesFor(row.topicId, row.subtopic).filter((r) => r.type === 'quiz');
      let statusClass = 'gap';
      let statusLabel = 'No material yet';
      if (noteCount > 0) {
        statusClass = 'has-notes';
        statusLabel = `${noteCount} note${noteCount === 1 ? '' : 's'}`;
      } else if (lectures.length > 0 || quizzes.length > 0) {
        statusClass = 'has-materials';
        statusLabel = 'No notes yet';
      }
      return `<tr class="coverage-row sub-row" data-topic="${row.topicId}" data-subtopic="${row.subtopic ? escapeHtml(row.subtopic) : ''}">
        <td>${escapeHtml(row.label)}</td>
        <td><span class="coverage-status ${statusClass}">${statusLabel}</span></td>
        <td>${renderLinkList(lectures)}</td>
        <td>${renderLinkList(quizzes)}</td>
      </tr>`;
    })
    .join('');

  wrap.innerHTML = `<table class="coverage-table">
    <thead><tr><th>Topic</th><th>Notes</th><th>Lecture materials</th><th>Quiz materials</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  wrap.querySelectorAll('.sub-row').forEach((tr) => {
    tr.addEventListener('click', (e) => {
      if (e.target.closest('a')) return; // let resource links behave normally
      activeTopicFilter = tr.dataset.topic;
      searchQuery = tr.dataset.subtopic || '';
      searchInput.value = searchQuery;
      setViewMode('notes');
      refreshAll();
    });
  });
}

function setViewMode(mode) {
  viewMode = mode;
  $('#notes-view').style.display = mode === 'notes' ? 'contents' : 'none';
  $('#coverage-view').classList.toggle('hidden', mode !== 'coverage');
  $('#coverage-toggle').classList.toggle('active', mode === 'coverage');
  if (mode === 'coverage') renderCoverage();
}

// ---------- actions ----------

function newNote() {
  const note = {
    id: uid(),
    title: '',
    topic: activeTopicFilter !== 'all' ? activeTopicFilter : TOPICS[0].id,
    subtopic: '',
    tags: [],
    content: '',
    pinned: false,
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
  upsertNote(note);
  activeNoteId = note.id;
  refreshAll();
  editorTitle.focus();
}

function saveActiveNoteFromForm() {
  const note = getActiveNote();
  if (!note) return;
  note.title = editorTitle.value;
  note.topic = editorTopic.value;
  note.subtopic = editorSubtopic.value;
  note.tags = editorTags.value
    .split(',')
    .map((s) => s.trim())
    .filter(Boolean);
  note.content = editorContent.value;
  note.updatedAt = Date.now();
  upsertNote(note);
  refreshAll();
}

function exportNotes() {
  const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cmpt225-fall26-notes-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importNotesFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (!Array.isArray(imported)) throw new Error('Not a list of notes');
      const existingIds = new Set(notes.map((n) => n.id));
      for (const n of imported) {
        if (!n.id || existingIds.has(n.id)) n.id = uid();
        n.topic = topicById(n.topic) ? n.topic : 'other';
        notes.push(n);
      }
      saveNotes(notes);
      refreshAll();
    } catch (e) {
      alert('Could not import that file: ' + e.message);
    }
  };
  reader.readAsText(file);
}

// ---------- events ----------

topicListEl.addEventListener('click', (e) => {
  const li = e.target.closest('.topic-item');
  if (!li) return;
  activeTopicFilter = li.dataset.topic;
  refreshAll();
});

noteListEl.addEventListener('click', (e) => {
  const li = e.target.closest('.note-item');
  if (!li) return;
  activeNoteId = li.dataset.id;
  refreshAll();
});

searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderNoteList();
});

$('#new-note-btn').addEventListener('click', newNote);

$('#delete-note-btn').addEventListener('click', () => {
  const note = getActiveNote();
  if (!note) return;
  if (!confirm(`Delete "${note.title || 'Untitled'}"? This cannot be undone.`)) return;
  deleteNote(note.id);
  refreshAll();
});

$('#pin-toggle').addEventListener('click', () => {
  const note = getActiveNote();
  if (!note) return;
  note.pinned = !note.pinned;
  note.updatedAt = Date.now();
  upsertNote(note);
  refreshAll();
});

editorTopic.addEventListener('change', () => {
  populateSubtopicSelect(editorTopic.value, '');
  renderRelatedMaterials();
  saveActiveNoteFromForm();
});

editorSubtopic.addEventListener('change', renderRelatedMaterials);

[editorTitle, editorSubtopic, editorTags].forEach((el) =>
  el.addEventListener('change', saveActiveNoteFromForm)
);

$('#coverage-toggle').addEventListener('click', () => {
  setViewMode(viewMode === 'coverage' ? 'notes' : 'coverage');
});

let saveTimer = null;
editorContent.addEventListener('input', () => {
  updatePreview();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveActiveNoteFromForm, 400);
});

previewToggle.addEventListener('click', () => {
  const showingPreview = !editorPreview.classList.contains('hidden');
  editorPreview.classList.toggle('hidden', showingPreview);
  editorContent.classList.toggle('hidden', !showingPreview);
  previewToggle.textContent = showingPreview ? 'Preview' : 'Edit';
  if (!showingPreview) updatePreview();
});

$('#export-btn').addEventListener('click', exportNotes);
$('#import-input').addEventListener('change', (e) => {
  if (e.target.files[0]) importNotesFromFile(e.target.files[0]);
  e.target.value = '';
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') {
    e.preventDefault();
    saveActiveNoteFromForm();
  }
});

// ---------- init ----------

populateTopicSelect();
refreshAll();
  </script>
</body>
</html>
